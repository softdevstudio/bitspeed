name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bash scripts/record-results.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: test/results/
  transfer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: vet and tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          go vet ./transfer/... ./cmd/bitspeed-transfer/... 2>&1 | tee vet.log || status=1
          go test -count=1 -v -run Windows ./transfer 2>&1 | tee windows.log || status=1
          python scripts/annotate-log.py notice windows-tests windows.log 120
          go test -count=1 ./transfer/... ./cmd/bitspeed-transfer/... 2>&1 | tee test.log || { status=1; python scripts/annotate-log.py error tests test.log 250; }
          go test -race -count=1 ./transfer/... ./cmd/bitspeed-transfer/... 2>&1 | tee race.log || { status=1; python scripts/annotate-log.py error race race.log 120; }
          go build -o bitspeed-transfer.exe ./cmd/bitspeed-transfer
          python -c "import tempfile, subprocess; d = tempfile.mkdtemp(); print(subprocess.run(['icacls', d], capture_output=True, text=True).stdout)" > acl.log 2>&1 || true
          python scripts/annotate-log.py notice python-tempdir-acl acl.log 20
          for script in smoke-transfer smoke-transfer-interruption smoke-transfer-tls; do
            python scripts/$script.py "$PWD/bitspeed-transfer.exe" > $script.log 2>&1 || { status=1; python scripts/annotate-log.py error $script $script.log 80; }
            python scripts/annotate-log.py notice $script $script.log 10
          done
          [ -s vet.log ] && python scripts/annotate-log.py warning vet vet.log 60
          exit $status
